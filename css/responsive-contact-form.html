<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Contact Form | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.w .cf{background:#fff;padding:18px;border-radius:12px;color:#4a1010}.w .g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.w .full{grid-column:1/-1}
.w label{font-size:.9rem;font-weight:600}.w input,.w textarea{width:100%;padding:10px;border:1px solid #ffb3b3;border-radius:6px;margin-top:4px;font:inherit}
.w button{margin-top:14px;padding:10px 26px;background:#c0392b;color:#fff;border:0;border-radius:6px}@media(max-width:560px){.w .g{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html">HTML · CSS · JS Programs</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to CSS Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Responsive Contact Form</h1>
  <p class="subtitle">Two-column fields that become one column on mobile.</p>
  <div class="program-box">
<div class="w"><form class="cf" onsubmit="return false"><div class="g"><label>First name<input></label><label>Last name<input></label><label>Email<input type="email"></label><label>Phone<input type="tel"></label>
<label class="full">Message<textarea rows="4"></textarea></label></div><button>Send message</button></form></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to CSS Programs</a>
  </footer>
</main>
<script>

</script>
</body>
</html>
