<body>
<header class="site-header">

</header>
<main>
  <h1 class="page-title">Swap Two Numbers</h1>
  <p class="subtitle">Swaps values using destructuring and using a temporary variable.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="run(); return false;">
  <label>A<input id="a" type="number" value="10"></label>
  <label>B<input id="b" type="number" value="25"></label>
  <button class="btn" type="submit">Swap</button>
</form>
<div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
// Reads the inputs, runs the program logic and prints the result.
function run() {
  const a = Number(document.getElementById('a').value);
  const b = Number(document.getElementById('b').value);
  const result = (() => {
    let x = a, y = b;
    [x, y] = [y, x];                       // destructuring swap
    let m = a, n = b, temp = m;            // temporary-variable swap
    m = n; n = temp;
    return 'Before: a=' + a + ', b=' + b + '\nAfter (destructuring): a=' + x + ', b=' + y + '\nAfter (temp variable): a=' + m + ', b=' + n;
  })();
  document.getElementById('out').textContent = result;
}
run();
</script>
</body>
</html>
