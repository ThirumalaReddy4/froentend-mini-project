<main>
  <h1 class="page-title">Factorial of a Number</h1>
  <p class="subtitle">Calculates n! using a loop.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="return false;"><label>Number<input id="n" type="number" value="5"></label><button class="btn" onclick="fact()">Calculate</button></form><div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

function fact(){
  let n=Number(document.getElementById('n').value), result=1;
  for(let i=2;i<=n;i++) result*=i;
  document.getElementById('out').textContent = `${n}! = ${result}`;
}

</script>
</body>
