<body>
<header class="site-header">

<main>
  <h1 class="page-title">Random Password Generator</h1>
  <p class="subtitle">Generates a random password of a chosen length using letters, numbers and symbols.</p>
  <div class="program-box">
<div class="demo-area">
  <input type="number" id="pwLen" placeholder="Length" value="12">
  <button class="btn" onclick="generate()">Generate Password</button>
  <div class="output-box" id="out"></div>
</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
function generate(){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
  const len = parseInt(document.getElementById("pwLen").value) || 12;
  let pwd = "";
  for (let i = 0; i < len; i++){
    pwd += chars[Math.floor(Math.random() * chars.length)];
  }
  document.getElementById("out").textContent = pwd;
}
</script>
</body>
