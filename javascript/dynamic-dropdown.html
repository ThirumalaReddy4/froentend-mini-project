<body>
<header class="site-header">

</header>
<main>
  <h1 class="page-title">Dynamic Dropdown List</h1>
  <p class="subtitle">Populates a select dropdown's options entirely from a JavaScript array.</p>
  <div class="program-box">
<div class="demo-area">
  <select id="fruitSelect"></select>
  <div class="output-box" id="out"></div>
</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
const fruits = ["Apple","Banana","Cherry","Mango","Orange"];
const select = document.getElementById("fruitSelect");
fruits.forEach(f => {
  const opt = document.createElement("option");
  opt.value = f; opt.textContent = f;
  select.appendChild(opt);
});
select.addEventListener("change", () => {
  document.getElementById("out").textContent = "You picked: " + select.value;
});
</script>
</body>
</html>
