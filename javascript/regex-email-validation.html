<main>
  <h1 class="page-title">Regular Expressions: Email Validation</h1>
  <p class="subtitle">Validates an email address format using a regular expression.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="return false;"><label>Email<input id="email" value="student@example.com"></label><button class="btn" onclick="check()">Validate</button></form><div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

function check(){
  const email = document.getElementById('email').value;
  const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  document.getElementById('out').textContent = pattern.test(email) ? 'Valid email address.' : 'Invalid email address.';
}

</script>
</body>
