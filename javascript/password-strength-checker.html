<main>
  <h1 class="page-title">Password Strength Checker</h1>
  <p class="subtitle">Rates a password as Weak, Medium or Strong based on length and character variety.</p>
  <div class="program-box">
<div class="demo-area">
  <input type="password" id="pwd" placeholder="Type a password" oninput="checkStrength()">
  <p>Strength: <span id="strength">-</span></p>
</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
function checkStrength(){
  const pwd = document.getElementById("pwd").value;
  let score = 0;
  if (pwd.length >= 8) score++;
  if (/[A-Z]/.test(pwd)) score++;
  if (/[0-9]/.test(pwd)) score++;
  if (/[^A-Za-z0-9]/.test(pwd)) score++;
  let label = "Weak";
  if (score >= 3) label = "Strong";
  else if (score === 2) label = "Medium";
  document.getElementById("strength").textContent = pwd ? label : "-";
}
</script>
</body>
