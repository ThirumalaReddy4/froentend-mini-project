<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body>
<header class="site-header">
  <a class="brand" href="../index.html">HTML · CSS · JS Programs</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>

  </nav>
</header>
<main>
  <h1 class="page-title">Reverse a String</h1>
  <p class="subtitle">split(), reverse() and join().</p>
  <div class="program-box">
<form class="demo-form" onsubmit="run(); return false;">
  <label>Text<input id="s" type="text" value="JavaScript"></label>
  <button class="btn" type="submit">Reverse</button>
</form>
<div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
// Reads the inputs, runs the program logic and prints the result.
function run() {
  const s = document.getElementById('s').value;
  const result = (() => {
    return 'Reversed: ' + s.split('').reverse().join('');
  })();
  document.getElementById('out').textContent = result;
}
run();
</script>
</body>
