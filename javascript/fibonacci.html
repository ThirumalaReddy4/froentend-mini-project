<main>
  <h1 class="page-title">Fibonacci Series</h1>
  <p class="subtitle">Generates the Fibonacci sequence up to N terms.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="return false;"><label>Terms<input id="n" type="number" value="10"></label><button class="btn" onclick="fib()">Generate</button></form><div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

function fib(){
  const n=Number(document.getElementById('n').value);
  let seq=[0,1];
  for(let i=2;i<n;i++) seq.push(seq[i-1]+seq[i-2]);
  document.getElementById('out').textContent = seq.slice(0,n).join(', ');
}

</script>
</body>
