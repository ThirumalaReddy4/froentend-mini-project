<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Form with Username/Password Validation | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>

</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html">HTML · CSS · JS Programs</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Login Form with Username/Password Validation</h1>
  <p class="subtitle">Validate a login form's username and password fields against simple rules before allowing login.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="return checkLogin(event)">
  <label>Username <input id="lgUser" type="text" required></label>
  <label>Password <input id="lgPass" type="password" required></label>
  <button class="btn" type="submit">Login</button>
</form>
<p class="output-box" id="lgOut"></p>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
function checkLogin(e){
  e.preventDefault();
  const user = document.getElementById('lgUser').value.trim();
  const pass = document.getElementById('lgPass').value;
  const out = document.getElementById('lgOut');
  if(user.length < 3){
    out.textContent = 'Username must be at least 3 characters.';
    out.style.color = '#c0392b';
  } else if(pass.length < 6){
    out.textContent = 'Password must be at least 6 characters.';
    out.style.color = '#c0392b';
  } else {
    out.textContent = 'Login successful! Welcome, ' + user + '.';
    out.style.color = 'green';
  }
  return false;
}
</script>
</body>
</html>
