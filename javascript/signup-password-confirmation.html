<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup Form with Password Confirmation | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>

</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html">HTML &middot; CSS &middot; JS Programs</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Signup Form with Password Confirmation</h1>
  <p class="subtitle">Checks that the password and confirm-password fields match before allowing submit.</p>
  <div class="program-box">
<div class="demo-area">
  <form onsubmit="return checkMatch(event)">
    <input type="password" id="pwd1" placeholder="Password">
    <input type="password" id="pwd2" placeholder="Confirm Password">
    <button class="btn" type="submit">Sign Up</button>
  </form>
  <div class="output-box" id="out"></div>
</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
function checkMatch(e){
  e.preventDefault();
  const p1 = document.getElementById("pwd1").value;
  const p2 = document.getElementById("pwd2").value;
  const out = document.getElementById("out");
  if (!p1 || !p2){ out.textContent = "Please fill both fields."; return false; }
  out.textContent = p1 === p2 ? "Passwords match! Account created." : "Passwords do not match.";
  return false;
}
</script>
</body>
</html>
