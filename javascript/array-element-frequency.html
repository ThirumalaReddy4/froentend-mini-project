<!DOCTYPE html>

<body>
<header class="site-header">
  <a class="brand" href="../index.html">HTML · CSS · JS Programs</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Frequency of Each Array Element</h1>
  <p class="subtitle">Counts how many times every element appears.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="run(); return false;">
  <label>Items (comma separated)<input id="arr" type="text" value="a, b, a, c, b, a, d"></label>
  <button class="btn" type="submit">Count</button>
</form>
<div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
// Reads the inputs, runs the program logic and prints the result.
function run() {
  const arr = document.getElementById('arr').value.split(',').map(x => x.trim()).filter(x => x !== '');
  const result = (() => {
    const freq = {};
    arr.forEach(x => freq[x] = (freq[x] || 0) + 1);
    return Object.entries(freq).map(([k, v]) => k + ' -> ' + v).join('\n');
  })();
  document.getElementById('out').textContent = result;
}
run();
</script>
</body>
</html>
