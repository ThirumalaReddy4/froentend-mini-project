<main>
  <h1 class="page-title">Change Image on Button Click</h1>
  <p class="subtitle">Cycles through images by changing the src attribute.</p>
  <div class="program-box">
<img id="pic" alt="demo" style="max-width:100%;border-radius:10px;display:block;margin-bottom:12px"><button class="btn" onclick="next()">Next Image</button> <button class="btn" onclick="pick(0)">Image 1</button>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>

<script>
const images = ["data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27400%27%20height%3D%27220%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23e74c3c%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23f39c12%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27url%28%23g%29%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2752%25%27%20font-family%3D%27Arial%27%20font-size%3D%2734%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%3EImage%201%3C/text%3E%3C/svg%3E", "data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27400%27%20height%3D%27220%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%2316a085%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%233498db%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27url%28%23g%29%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2752%25%27%20font-family%3D%27Arial%27%20font-size%3D%2734%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%3EImage%202%3C/text%3E%3C/svg%3E", "data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27400%27%20height%3D%27220%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%238e44ad%27/%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%23e84393%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27url%28%23g%29%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2752%25%27%20font-family%3D%27Arial%27%20font-size%3D%2734%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%3EImage%203%3C/text%3E%3C/svg%3E"];
let index = 0;
const pic = document.getElementById('pic');
function show() { pic.src = images[index]; }
function next() { index = (index + 1) % images.length; show(); }
function pick(i) { index = i; show(); }
show();
</script>
