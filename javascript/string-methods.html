<main>
  <h1 class="page-title">String Methods Demo</h1>
  <p class="subtitle">Demonstrates common string methods: upper, lower, slice, split, replace, includes.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="return false;"><label>Enter text<input id="s" value="Hello JavaScript World"></label><button class="btn" onclick="demo()">Run Methods</button></form><div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

function demo(){
  const s = document.getElementById('s').value;
  document.getElementById('out').textContent =
`Original: ${s}
Uppercase: ${s.toUpperCase()}
Lowercase: ${s.toLowerCase()}
Length: ${s.length}
Reversed: ${s.split('').reverse().join('')}
Includes "Java": ${s.includes('Java')}
Replace "World" -> "Students": ${s.replace('World','Students')}
Words: ${s.split(' ').length}`;
}

</script>
