<body>
<header class="site-header">

</header>
<main>
  <h1 class="page-title">Least Common Multiple (LCM)</h1>
  <p class="subtitle">LCM = (a x b) / GCD(a, b).</p>
  <div class="program-box">
<form class="demo-form" onsubmit="run(); return false;">
  <label>Number A<input id="a" type="number" value="12"></label>
  <label>Number B<input id="b" type="number" value="18"></label>
  <button class="btn" type="submit">Find LCM</button>
</form>
<div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
// Reads the inputs, runs the program logic and prints the result.
function run() {
  const a = Number(document.getElementById('a').value);
  const b = Number(document.getElementById('b').value);
  const result = (() => {
    const gcd = (x, y) => y === 0 ? x : gcd(y, x % y);
    const g = gcd(Math.abs(a), Math.abs(b));
    return 'LCM of ' + a + ' and ' + b + ' = ' + (Math.abs(a * b) / g);
  })();
  document.getElementById('out').textContent = result;
}
run();
</script>
</body>
</html>
