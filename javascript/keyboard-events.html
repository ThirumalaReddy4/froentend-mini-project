<!DOCTYPE html>

<body>
<header class="site-header">

  <nav class="crumbs">

</header>
<main>
  <h1 class="page-title">Keyboard Events</h1>
  <p class="subtitle">Shows which key was pressed using keydown and keyup events.</p>
  <div class="program-box">
<div class="demo-area">
  <input type="text" id="kbInput" placeholder="Press any key...">
  <div class="output-box" id="out"></div>
</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
const input = document.getElementById("kbInput");
const out = document.getElementById("out");
input.addEventListener("keydown", e => out.textContent = "keydown: " + e.key);
input.addEventListener("keyup", e => out.textContent += " | keyup: " + e.key);
</script>
</body>
</html>
