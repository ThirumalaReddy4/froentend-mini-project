  <h1 class="page-title">Digital Clock</h1>

  <div class="program-box">
<div class="demo-area" style="text-align:center;font-size:2.4rem;letter-spacing:2px;" id="clock">--:--:--</div>
  </div>

<script>

function tick(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString();
}
tick();
setInterval(tick, 1000);

</script>
