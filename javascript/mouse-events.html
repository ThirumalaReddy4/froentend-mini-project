<body>
<header class="site-header">

  <nav class="crumbs">

</header>
<main>
  <h1 class="page-title">Mouse Events</h1>
  <p class="subtitle">Demonstrates click, mouseover, mouseout and mousemove events.</p>
  <div class="program-box">
<div class="demo-area">
  <div id="box" style="height:120px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;">Move / click / hover over me</div>
  <div class="output-box" id="out"></div>
</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
const box = document.getElementById("box");
const out = document.getElementById("out");
box.addEventListener("click", () => out.textContent = "click event fired");
box.addEventListener("mouseover", () => out.textContent = "mouseover event fired");
box.addEventListener("mouseout", () => out.textContent = "mouseout event fired");
box.addEventListener("mousemove", e => out.textContent = "mousemove at " + e.offsetX + ", " + e.offsetY);
</script>
</body>
</html>
