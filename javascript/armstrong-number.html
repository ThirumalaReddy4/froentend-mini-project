<main>
  <h1 class="page-title">Armstrong Number</h1>
  <p class="subtitle">A number equal to the sum of its digits each raised to the number of digits.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="run(); return false;">
  <label>Number<input id="n" type="number" value="153"></label>
  <button class="btn" type="submit">Check</button>
</form>
<div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
// Reads the inputs, runs the program logic and prints the result.
function run() {
  const n = Number(document.getElementById('n').value);
  const result = (() => {
    const digits = String(Math.abs(n)).split('');
    const sum = digits.reduce((s, d) => s + Math.pow(Number(d), digits.length), 0);
    return n + (sum === n ? ' is' : ' is NOT') + ' an Armstrong number (digit-power sum = ' + sum + ').';
  })();
  document.getElementById('out').textContent = result;
}
run();
</script>
</body>
