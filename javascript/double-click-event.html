<main>
  <h1 class="page-title">Double-Click Event</h1>
  <p class="subtitle">Detects the dblclick event and changes an element's style in response.</p>
  <div class="program-box">
<div class="demo-area">
  <div id="box" style="height:100px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;">Double-click me</div>
</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
document.getElementById("box").addEventListener("dblclick", function(){
  this.style.background = "var(--accent)";
  this.textContent = "Double-clicked!";
});
</script>
