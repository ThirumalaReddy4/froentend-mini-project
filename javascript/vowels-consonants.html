<main>
  <h1 class="page-title">Count Vowels and Consonants</h1>
  <p class="subtitle">Counts letters in a string.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="run(); return false;">
  <label>Text<input id="s" type="text" value="Hello World from JavaScript"></label>
  <button class="btn" type="submit">Count</button>
</form>
<div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
// Reads the inputs, runs the program logic and prints the result.
function run() {
  const s = document.getElementById('s').value;
  const result = (() => {
    let v = 0, c = 0;
    for (const ch of s.toLowerCase()) {
      if ('aeiou'.includes(ch)) v++;
      else if (ch >= 'a' && ch <= 'z') c++;
    }
    return 'Vowels: ' + v + '\nConsonants: ' + c;
  })();
  document.getElementById('out').textContent = result;
}
run();
</script>
</body>
