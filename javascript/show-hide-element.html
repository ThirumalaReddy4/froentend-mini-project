  <h1 class="page-title">Show / Hide Element</h1>
  <p class="subtitle">Toggles the visibility of an element using a button click event.</p>
  <div class="program-box">

<button class="btn" onclick="toggle()">Show / Hide</button>
<div class="demo-area" id="box">I can be hidden and shown again.</div>

  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
function toggle(){const b=document.getElementById('box'); b.style.display = (b.style.display==='none') ? 'block' : 'none';}
</script>
