<!DOCTYPE html>

<body>

<main>
  <h1 class="page-title">Password Show / Hide Toggle</h1>
  <p class="subtitle">Toggles a password field between hidden and visible text.</p>
  <div class="program-box">
<div class="demo-area">
  <input type="password" id="pwd" placeholder="Enter password">
  <button class="btn" onclick="toggle()">Show / Hide</button>
</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
function toggle(){
  const pwd = document.getElementById("pwd");
  pwd.type = pwd.type === "password" ? "text" : "password";
}
</script>
</body>
