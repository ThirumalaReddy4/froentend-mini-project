<main>
  <h1 class="page-title">Digital Clock (Mini Project - 12-Hour Format)</h1>
  <p class="subtitle">A digital clock mini project showing live time in 12-hour format with AM/PM.</p>
  <div class="program-box">
<div class="output-box" id="clk12" style="font-size:2rem; text-align:center;"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
function tick(){
  const d = new Date();
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const m = String(d.getMinutes()).padStart(2,'0');
  const s = String(d.getSeconds()).padStart(2,'0');
  document.getElementById('clk12').textContent = h + ':' + m + ':' + s + ' ' + ampm;
}
setInterval(tick, 1000);
tick();
</script>
</body>
