<body>
<header class="site-header">

  <nav class="crumbs">
    <a href="../index.html">Home</a>

</header>
<main>
  <h1 class="page-title">Fetch API Demo</h1>
  <p class="subtitle">Fetches live data from a public API and displays it.</p>
  <div class="program-box">
<button class="btn" onclick="load()">Fetch a Random Joke</button><div class="output-box" id="out">Click the button to fetch data…</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

async function load(){
  const out = document.getElementById('out');
  out.textContent = 'Loading...';
  try{
    const res = await fetch('https://official-joke-api.appspot.com/random_joke');
    const data = await res.json();
    out.textContent = `${data.setup}\n\n${data.punchline}`;
  }catch(e){
    out.textContent = 'Could not fetch data (no network in this sandbox). This code works in a normal browser with internet access.';
  }
}

</script>
</body>
</html>
