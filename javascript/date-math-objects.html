<main>
  <h1 class="page-title">Date and Math Objects</h1>
  <p class="subtitle">Shows the current date parts and several Math functions.</p>
  <div class="program-box">
<button class="btn" onclick="run()">Refresh</button><div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

function run() {
  const d = new Date();
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('out').textContent =
    'Date: ' + d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear() + ' (' + days[d.getDay()] + ')' +
    '\nTime: ' + d.toLocaleTimeString() + '\nISO: ' + d.toISOString() +
    '\n\nMath.PI = ' + Math.PI.toFixed(5) + '\nMath.sqrt(144) = ' + Math.sqrt(144) + '\nMath.pow(2, 8) = ' + Math.pow(2, 8) +
    '\nMath.round(4.6) = ' + Math.round(4.6) + '  floor(4.9) = ' + Math.floor(4.9) + '  ceil(4.1) = ' + Math.ceil(4.1) +
    '\nMath.max(3, 9, 5) = ' + Math.max(3, 9, 5) + '  min = ' + Math.min(3, 9, 5) +
    '\nMath.random() = ' + Math.random().toFixed(4) + '\nRandom 1-100: ' + (Math.floor(Math.random() * 100) + 1);
}
run();
</script>
</body>
