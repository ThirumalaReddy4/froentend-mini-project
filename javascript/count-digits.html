<main>
  <h1 class="page-title">Count Digits in a Number</h1>
  <p class="subtitle">Counts how many digits a number has.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="run(); return false;">
  <label>Number<input id="n" type="number" value="987654"></label>
  <button class="btn" type="submit">Count</button>
</form>
<div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
// Reads the inputs, runs the program logic and prints the result.
function run() {
  const n = Number(document.getElementById('n').value);
  const result = (() => {
    let num = Math.abs(Math.trunc(n)), count = 0;
    do { count++; num = Math.floor(num / 10); } while (num > 0);
    return n + ' has ' + count + ' digit(s).';
  })();
  document.getElementById('out').textContent = result;
}
run();
</script>
</body>
