<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display API Data Dynamically | Practical Programs</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
.ulist{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}.ucard{background:#fff;padding:10px;border-radius:8px;border-left:5px solid #c0392b;color:#4a1010}
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html">HTML · CSS · JS Programs</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Display API Data Dynamically</h1>
  <p class="subtitle">Fetches users from a public API and builds cards in the DOM (falls back to sample data when offline).</p>
  <div class="program-box">
<button class="btn" onclick="load()">Load Users</button><div id="list" class="ulist"></div><div class="output-box" id="out">Click the button.</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>

const sample = [
  { name: 'Leanne Graham', email: 'leanne@example.com', company: { name: 'Romaguera-Crona' } },
  { name: 'Ervin Howell', email: 'ervin@example.com', company: { name: 'Deckow-Crist' } },
  { name: 'Clementine Bauch', email: 'clem@example.com', company: { name: 'Romaguera-Jacobson' } }
];
function render(users) {
  const list = document.getElementById('list');
  list.innerHTML = '';
  users.slice(0, 6).forEach(u => {
    const div = document.createElement('div');
    div.className = 'ucard';
    div.innerHTML = `<b>${u.name}</b><br>${u.email}<br><small>${u.company.name}</small>`;
    list.appendChild(div);
  });
}
async function load() {
  const out = document.getElementById('out');
  out.textContent = 'Loading...';
  try {
    const res = await fetch('https://jsonplaceholder.typicode.com/users');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    render(await res.json());
    out.textContent = 'Loaded from the live API.';
  } catch (err) {
    render(sample);
    out.textContent = 'API not reachable (' + err.message + '). Showing sample data instead.';
  }
}
</script>
</body>
</html>
