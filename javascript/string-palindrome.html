<main>
  <h1 class="page-title">Palindrome String Check</h1>
  <p class="subtitle">Ignores case, spaces and punctuation.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="run(); return false;">
  <label>Text<input id="s" type="text" value="A man, a plan, a canal: Panama"></label>
  <button class="btn" type="submit">Check</button>
</form>
<div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
// Reads the inputs, runs the program logic and prints the result.
function run() {
  const s = document.getElementById('s').value;
  const result = (() => {
    const clean = s.toLowerCase().replace(/[^a-z0-9]/g, '');
    const isPal = clean === clean.split('').reverse().join('');
    return '"' + s + '" ' + (isPal ? 'IS' : 'is NOT') + ' a palindrome.';
  })();
  document.getElementById('out').textContent = result;
}
run();
</script>
</body>
