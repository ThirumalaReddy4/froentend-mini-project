<main>
  <h1 class="page-title">Reverse a Number</h1>
  <p class="subtitle">Reverses digits using a while loop with % and Math.floor.</p>
  <div class="program-box">
<form class="demo-form" onsubmit="run(); return false;">
  <label>Number<input id="n" type="number" value="12345"></label>
  <button class="btn" type="submit">Reverse</button>
</form>
<div class="output-box" id="out"></div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
// Reads the inputs, runs the program logic and prints the result.
function run() {
  const n = Number(document.getElementById('n').value);
  const result = (() => {
    let num = Math.abs(n), rev = 0;
    while (num > 0) { rev = rev * 10 + (num % 10); num = Math.floor(num / 10); }
    return 'Reverse of ' + n + ' is ' + (n < 0 ? -rev : rev);
  })();
  document.getElementById('out').textContent = result;
}
run();
</script>
</body>
