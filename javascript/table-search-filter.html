<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search / Filter Table Records | Practical Programs</title>

<style>

</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html">HTML &middot; CSS &middot; JS Programs</a>
  <nav class="crumbs">
    <a href="../index.html">Home</a>
    <a href="index.html">Back to JavaScript Programs</a>
  </nav>
</header>
<main>
  <h1 class="page-title">Search / Filter Table Records</h1>
  <p class="subtitle">Filters visible table rows live as you type in the search box.</p>
  <div class="program-box">
<div class="demo-area">
  <input type="text" id="searchBox" placeholder="Search by name..." onkeyup="filterTable()">
  <table class="demo-table" id="dataTable">
    <tr><th>Name</th><th>City</th></tr>
    <tr><td>Asha</td><td>Chennai</td></tr>
    <tr><td>Ravi</td><td>Vijayawada</td></tr>
    <tr><td>Meera</td><td>Kadapa</td></tr>
    <tr><td>Kiran</td><td>Hyderabad</td></tr>
  </table>
</div>
  </div>
  <footer class="page-nav">
    <a href="../index.html">Home</a>
    <a class="secondary" href="index.html">Back to JavaScript Programs</a>
  </footer>
</main>
<script>
function filterTable(){
  const q = document.getElementById("searchBox").value.toLowerCase();
  const rows = document.querySelectorAll("#dataTable tr");
  rows.forEach((row, i) => {
    if (i === 0) return;
    const name = row.cells[0].textContent.toLowerCase();
    row.style.display = name.includes(q) ? "" : "none";
  });
}
</script>
</body>
</html>
